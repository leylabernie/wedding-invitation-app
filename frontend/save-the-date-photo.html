<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d41173",
                        "background-light": "#f8f6f7",
                        "background-dark": "#221019",

                    fontFamily: {

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased h-screen flex flex-col overflow-hidden">

<div class="absolute inset-0 flex flex-col justify-end items-center p-8 pb-12 text-center text-white">
<p class="text-xs tracking-[0.3em] uppercase mb-4 opacity-90">Save the Date</p>

<p class="text-xs uppercase tracking-widest mt-1 opacity-80">Tuscany, Italy</p>
</div>

<div class="absolute inset-4 border border-white/20 pointer-events-none rounded-lg"></div>
</div>

<button class="flex-1 py-2 px-3 rounded-lg bg-primary text-white flex items-center justify-center gap-2 text-xs font-semibold">
<span class="material-symbols-outlined text-lg">fullscreen</span> Full Bleed

<button class="flex-1 py-2 px-3 rounded-lg bg-zinc-100 dark:bg-white/5 text-zinc-600 dark:text-white/70 flex items-center justify-center gap-2 text-xs font-semibold border border-transparent hover:border-primary/50 transition-all">

</div>
</div>
<!-- Tool Selection -->
<div class="flex items-center justify-around">
<button class="flex flex-col items-center gap-1 text-zinc-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">image</span>
<span class="text-[10px] font-semibold uppercase tracking-tighter">Photo</span>

<button class="flex flex-col items-center gap-1 text-zinc-400 hover:text-primary transition-colors">

<button class="flex flex-col items-center gap-1 text-zinc-400 hover:text-primary transition-colors">

<button class="flex flex-col items-center gap-1 text-zinc-400 hover:text-primary transition-colors">
